function p(s){ return (s||"").split("{nome}").join(name||"friend"); }
function progress(){ var pct=Math.max(4, Math.round((idx/(total-1))*100)); pfill.style.width=pct+"%"; pnub.style.left=pct+"%"; }
function showCTA(label,note){ ctawrap.style.display="block"; ctaBtn.textContent=label; cnote.innerHTML=note||"⏱️ Takes less than 3 minutes"; }
function hideCTA(){ ctawrap.style.display="none"; }
function next(){ idx++; if(idx>=total) idx=total-1; render(); window.scrollTo(0,0); }

function render(){
  var s=STEPS[idx]; progress(); hideCTA(); var html="";
  document.body.classList.toggle('offer', s.k==="result");

  if(s.k==="intro"){
    html+='<div class="eyebrow">'+s.eyebrow+'</div>';
    html+='<h1 class="q" style="margin-top:6px">'+s.h+'</h1>';
    html+='<img class="hero-img" src="'+s.img+'" alt="Gourmet round popcorn">';
    html+='<p class="lede">'+s.lede+'</p>';
    html+='<div class="sub">'+s.note+'</div>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="form"){
    html+='<h1 class="q">'+p(s.h)+'</h1>';
    html+='<div class="field"><label>'+s.label+'</label><input id="nmeInp" type="text" autocomplete="given-name" placeholder="Type here..."></div>';
    scr.innerHTML=html;
    var inp=document.getElementById('nmeInp'); inp.focus();
    showCTA(s.cta+" →");
    ctaBtn.onclick=function(){ var v=inp.value.trim(); if(!v){inp.focus();return;} name=v.split(" ")[0]; next(); };
    inp.addEventListener('keydown',function(e){ if(e.key==="Enter") ctaBtn.click(); });
    return;
  }

  if(s.k==="reward"){
    if(s.head) html+='<h1 class="q">'+p(s.head)+'</h1>';
    if(s.body) html+='<p class="lede" style="font-size:15.5px">'+p(s.body)+'</p>';
    html+='<div class="reward"><span class="emo">'+s.emo+'</span><div><b>'+s.title+'</b><small>+ $'+s.val+' added to your gift 🎉</small></div></div>';
    scr.innerHTML=html; setEarn(s.val);
    showCTA("Continue →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="q"){
    html+='<h1 class="q">'+p(s.h)+'</h1><div class="opts">';
    s.opts.forEach(function(o){ html+='<button class="opt"><span class="tick"></span><span>'+o+'</span></button>'; });
    html+='</div>';
    scr.innerHTML=html;
    [].forEach.call(scr.querySelectorAll('.opt'),function(b){ b.onclick=next; });
    return;
  }

  if(s.k==="note"){
    html+='<div class="center" style="font-size:40px">'+s.emo+'</div>';
    html+='<h1 class="q center">'+p(s.h)+'</h1>';
    html+='<p class="lede">'+p(s.body)+'</p>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="tiles"){
    html+='<h1 class="q">'+p(s.h)+'</h1><div class="tiles">';
    s.tiles.forEach(function(t){ html+='<div class="tile"><span class="emo">'+t.e+'</span><div><b>'+t.t+'</b><p>'+t.p+'</p></div></div>'; });
    html+='</div>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="calc"){
    html+='<h1 class="q">'+p(s.h)+'</h1><div class="calc">';
    s.rows.forEach(function(r){ html+='<div class="row'+(r.big?' big':'')+'"><span class="l">'+r.e+' '+r.l+'</span><span class="v">'+r.v+'</span></div>'; });
    html+='</div><p class="sub">'+s.foot+'</p>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="flavors"){
    html+='<h1 class="q">'+p(s.h)+'</h1><div class="flav">';
    s.items.forEach(function(f){ html+='<div class="fcard"><img loading="lazy" src="'+f.img+'" alt="'+f.t+'"><div class="fb"><b>'+f.t+'</b><p>'+f.p+'</p></div></div>'; });
    html+='</div>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="timeline"){
    html+='<h1 class="q">'+p(s.h)+'</h1><p class="lede" style="font-size:15.5px">'+p(s.lede)+'</p><div class="tl">';
    s.items.forEach(function(t){ html+='<div class="tli"><img loading="lazy" src="'+t.img+'" alt="'+t.t+'"><div class="tb"><div class="phase">'+t.phase+'</div><div class="ttl">'+t.t+'</div><div class="stt">'+t.s+'</div><p>'+t.p+'</p></div></div>'; });
    html+='</div>';
    scr.innerHTML=html; showCTA(s.cta+" →"); ctaBtn.onclick=next; return;
  }

  if(s.k==="loading"){
    html+='<div class="load"><div class="spin"></div><h1 class="q center">'+p(s.h)+'</h1><div class="loadbar"><i></i></div><p class="sub center" style="margin-top:14px">'+s.sub+'</p></div>';
    scr.innerHTML=html; hideCTA();
    setTimeout(next,3500); return;
  }

  if(s.k==="result"){
    html+='<div class="center"><div class="eyebrow">🎉 Gifts unlocked</div>';
    html+='<h1 class="q" style="margin-top:6px">All set, '+(name||"friend")+'! You unlocked $'+earned+' in free gifts inside The $12 Bag Method</h1></div>';
    html+='<p class="lede center" style="font-size:15px">Everything below is reserved in your name. Tap the button and get instant access — start your first batch this week.</p>';
    if(VIDEO_SRC){ html+='<div class="vwrap"><video controls playsinline poster="intro-loop-poster.webp" style="width:100%;height:100%;object-fit:cover"><source src="'+VIDEO_SRC+'" type="video/mp4"></video></div>'; }
    // Instructor
    html+='<div class="instr"><img loading="lazy" src="EXPERT.webp" alt="Carmela Vega — Gourmet Popcorn Expert & Instructor"><div><div class="eyebrow">Your instructor</div><b>Carmela Vega</b><p>Gourmet popcorn expert & instructor. She’ll walk you through the entire process step-by-step — from your very first batch to landing big orders.</p></div></div>';
    html+='<div class="gifts"><h3>Everything you get inside The $12 Bag Method</h3>'+
      gline("🍿","Irresistible recipes that sell themselves","Over 60 best-selling gourmet flavors, step-by-step.","$97")+
      gline("⏳","The 20-Day Crunch Secret","The exact technique to keep your popcorn perfectly crunchy for 20 days without going stale.","$47")+
      gline("🎁","The Luxury Packaging Playbook","How to make your bags look so premium you can easily charge 4x more.","$37")+
      gline("📱","Done-For-You Captions","Ready-to-use posts — just copy, paste, and sell every day.","$47")+
      gline("🎉","The Ultimate Party Guide","How to land huge bulk orders and make a month\'s income in a single day.","$67")+
      gline("🚀","Business from Scratch Roadmap","The exact plan to start today and get your first paying customers in 7 days.","$67")+
      '<div class="gline totalv"><span class="ge">🧾</span><div><b>Total value</b><p>Everything above, if sold separately</p></div><span class="gv totalp">$362</span></div>'+
      '</div>';
    html+='<div class="pricebox"><div class="from">Total value $362</div><div class="now">$'+PRICE+'</div><div class="once">One-time payment · instant lifetime access · no monthly fees</div></div>';
    // Guarantee
    html+='<div class="guar"><img loading="lazy" src="7days.webp" alt="Money-back guarantee"><div><b>7-Day "Love It or It\'s Free" Guarantee</b><p>Go through the method and make your first batch. If you’re not thrilled within 7 days, email us for a 100% refund — and <b>keep every bonus</b>. All the risk is on us, not you.</p></div></div>';
    // Testimonials / proof
    html+='<div class="center" style="margin-top:22px"><div class="eyebrow">Real proof from our students who transformed their lives</div></div>';
    html+='<div class="proofgrid">'+
      '<img loading="lazy" src="testimonial-2.webp" alt="Student result">'+
      '<img loading="lazy" src="testimonial-3.webp" alt="Student result">'+
      '<img loading="lazy" src="testimonial-4.webp" alt="Student result">'+
      '<img loading="lazy" src="testimonial-5.webp" alt="Student result">'+
      '<img loading="lazy" src="testimonial-6.webp" alt="Student result">'+
      '<img loading="lazy" src="proof-1.webp" alt="Student result">'+
      '<img loading="lazy" src="proof-2.webp" alt="Student result">'+
      '</div>';
    html+='<p class="sub center">After payment, you’ll receive an email with access to the online platform.</p>';
    html+='<div class="disc">Results are not guaranteed and vary from person to person. The income figures shown are illustrative examples, not a promise of earnings. This is an educational product.</div>';
    scr.innerHTML=html;
    showCTA("Get my gifts →","🔒 Secure checkout · instant access");
    document.querySelector('.urg')&&0;
    cnote.innerHTML="🔒 Secure checkout · instant access";
    // add urgency line
    var u=document.createElement('div'); u.className='urg'; u.textContent='⏳ Launch price — this round only, then it goes back up'; cnote.parentNode.insertBefore(u,cnote.nextSibling);
    ctaBtn.onclick=function(){
      try{ if(window.fbq) fbq('track','InitiateCheckout',{value:parseFloat(PRICE),currency:'USD'}); }catch(e){}
      if(CHECKOUT_URL && CHECKOUT_URL.indexOf('http')===0){ location.href=CHECKOUT_URL+(location.search||""); }
    };
    return;
  }
}
function gline(e,t,p,v){ return '<div class="gline"><span class="ge">'+e+'</span><div><b>'+t+'</b><p>'+p+'</p></div>'+(v?'<span class="gv">'+v+'</span>':'')+'</div>'; }

setEarn(0); render();
</script>
</body>
</html>
